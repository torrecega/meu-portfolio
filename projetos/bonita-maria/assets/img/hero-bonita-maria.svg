<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F3EEE5"/><stop offset="1" stop-color="#E7E0D3"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DED5C4"/><stop offset="1" stop-color="#CFC4AF"/>
  </linearGradient>
  <radialGradient id="key" cx="46%" cy="38%" r="58%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="46%" r="72%">
    <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#3A2E22" stop-opacity=".12"/>
  </radialGradient>

  <!-- leather body: key light upper-left, core shadow lower-right, rim light on the right edge -->
  <linearGradient id="body" x1=".08" y1="0" x2=".95" y2="1">
    <stop offset="0" stop-color="#D2A16D"/>
    <stop offset=".26" stop-color="#B0703F"/>
    <stop offset=".76" stop-color="#85512C"/>
    <stop offset=".95" stop-color="#B0703F" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="bodyV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
    <stop offset=".18" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".82" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="flap" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#B0703F"/>
    <stop offset=".55" stop-color="#85512C"/>
    <stop offset="1" stop-color="#5F3A1C"/>
  </linearGradient>
  <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#85512C"/>
    <stop offset=".38" stop-color="#B0703F"/>
    <stop offset=".62" stop-color="#D2A16D" stop-opacity=".75"/>
    <stop offset="1" stop-color="#85512C"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#F0D9A4"/>
    <stop offset=".34" stop-color="#C39C5E"/>
    <stop offset=".62" stop-color="#8A6836"/>
    <stop offset=".85" stop-color="#D8BC80"/>
    <stop offset="1" stop-color="#7A5A2C"/>
  </linearGradient>

  <!-- Pebbled leather. Turbulence is used as a bump map and lit, then added to the
       leather with feComposite/arithmetic: k4 cancels the grain's mean brightness, so
       it embosses without shifting the colour. All SVG 1.1 core - no blend modes,
       which silently no-op when a clip or filter isolates the group. -->
  <filter id="leather" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.34" numOctaves="4" seed="13" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#ffffff" surfaceScale="1.25" result="lit">
      <feDistantLight azimuth="228" elevation="56"/>
    </feDiffuseLighting>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="53" result="fine"/>
    <feColorMatrix in="fine" type="saturate" values="0" result="fineg"/>
    <feComposite in="lit" in2="fineg" operator="arithmetic" k1="0" k2="0.82" k3="0.18" k4="0" result="bump"/>
    <feComposite in="bump" in2="SourceGraphic" operator="arithmetic"
                 k1="0" k2="0.26" k3="1" k4="-0.135" result="emb"/>
    <feComposite in="emb" in2="SourceGraphic" operator="in"/>
  </filter>

  <filter id="soft" x="-45%" y="-160%" width="190%" height="420%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="tight" x="-30%" y="-140%" width="160%" height="380%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="occl" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>

  <linearGradient id="skin" x1=".15" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#D3A176"/>
    <stop offset=".45" stop-color="#B8845C"/>
    <stop offset="1" stop-color="#8A5B3A"/>
  </linearGradient>
  <linearGradient id="coat" x1=".1" y1="0" x2=".95" y2="1">
    <stop offset="0" stop-color="#C97C58"/>
    <stop offset=".3" stop-color="#A8543A"/>
    <stop offset=".82" stop-color="#7C3A26"/>
    <stop offset="1" stop-color="#5C2919"/>
  </linearGradient>
  <linearGradient id="coatV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/>
    <stop offset=".22" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="hair" x1=".2" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#4A403A"/>
    <stop offset=".42" stop-color="#241F1C"/>
    <stop offset="1" stop-color="#100D0B"/>
  </linearGradient>
  <linearGradient id="trouser" x1=".2" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#4A443E"/>
    <stop offset=".45" stop-color="#37322E"/>
    <stop offset="1" stop-color="#22201D"/>
  </linearGradient>
  <filter id="fold" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="figshadow" x="-40%" y="-200%" width="180%" height="500%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <clipPath id="ccoat" transform="translate(40 30) scale(0.94)">
    <path d="M414 358 Q500 334 586 358 L612 872 Q500 894 388 872 Z"/>
  </clipPath>
  <clipPath id="ctrouser" transform="translate(40 30) scale(0.94)">
    <path d="M428 846 L572 846 L566 1250 L518 1250 L500 986 L482 1250 L434 1250 Z"/>
  </clipPath></defs>
<rect width="1000" height="1250" fill="url(#wall)"/>
<rect y="1096" width="1000" height="154" fill="url(#floor)"/>
<rect y="1062" width="1000" height="68" fill="url(#floor)" opacity=".6" filter="url(#occl)"/>
<path d="M186 1250 L186 604 A314 314 0 0 1 814 604 L814 1250 Z" fill="#EBE3D5" opacity=".85"/>
<rect width="1000" height="1250" fill="url(#key)"/>
<ellipse cx="512" cy="1188" rx="228" ry="30" fill="#5A4632" opacity=".3" filter="url(#figshadow)"/>
<g transform="translate(40 30) scale(0.94)">
    <path d="M428 846 L572 846 L566 1250 L518 1250 L500 986 L482 1250 L434 1250 Z" fill="url(#trouser)"/>
    <g clip-path="url(#ctrouser)">
      <path d="M470 900 C462 1000 466 1120 458 1250" fill="none" stroke="#15130F" stroke-width="16" opacity=".4" filter="url(#fold)"/>
      <path d="M542 900 C548 1010 544 1130 550 1250" fill="none" stroke="#15130F" stroke-width="20" opacity=".35" filter="url(#fold)"/>
    </g>
    <!-- hair behind the shoulders -->
    <ellipse cx="500" cy="252" rx="71" ry="79" fill="url(#hair)"/>
    <path d="M431 250 Q423 382 439 436 L473 430 Q455 356 461 258 Z" fill="url(#hair)"/>
    <path d="M569 250 Q577 382 561 436 L527 430 Q545 356 539 258 Z" fill="url(#hair)"/>
    <!-- neck, with the shadow the jaw casts on it -->
    <rect x="480" y="292" width="40" height="74" fill="url(#skin)"/>
    <ellipse cx="500" cy="300" rx="30" ry="16" fill="#000" opacity=".26" filter="url(#fold)"/>
    <ellipse cx="500" cy="268" rx="51" ry="61" fill="url(#skin)"/>
    <path d="M449 246 Q452 190 500 188 Q548 190 551 246 Q520 214 449 246 Z" fill="url(#hair)"/>
    <ellipse cx="474" cy="216" rx="20" ry="11" fill="#FFF" opacity=".14" transform="rotate(-22 474 216)"/>
    <!-- sleeves sit under the coat body -->
    <path d="M430 386 C400 508 392 614 398 706" fill="none" stroke="#7C3A26" stroke-width="52" stroke-linecap="round"/>
    <path d="M572 386 C602 500 600 586 578 636" fill="none" stroke="#7C3A26" stroke-width="52" stroke-linecap="round"/>
    <path d="M578 636 C566 682 546 704 528 716" fill="none" stroke="#7C3A26" stroke-width="45" stroke-linecap="round"/>
    <circle cx="400" cy="716" r="21" fill="url(#skin)"/>
    <!-- coat -->
    <path d="M414 358 Q500 334 586 358 L612 872 Q500 894 388 872 Z" fill="url(#coat)"/>
    <path d="M414 358 Q500 334 586 358 L612 872 Q500 894 388 872 Z" fill="url(#coatV)"/>
    <g clip-path="url(#ccoat)">
      <path d="M446 420 C438 560 444 700 436 862" fill="none" stroke="#5C2919" stroke-width="14" opacity=".34" filter="url(#fold)"/>
      <path d="M566 430 C574 570 568 710 578 866" fill="none" stroke="#5C2919" stroke-width="18" opacity=".3" filter="url(#fold)"/>
      <path d="M500 540 C494 660 502 760 498 860" fill="none" stroke="#5C2919" stroke-width="9" opacity=".26" filter="url(#fold)"/>
    </g>
    <!-- collar and lapels -->
    <path d="M466 344 L500 486 L534 344 Q500 330 466 344 Z" fill="#EFE9DE"/>
    <path d="M466 344 L500 486 L470 366 Z" fill="#7C3A26"/>
    <path d="M534 344 L500 486 L530 366 Z" fill="#5C2919"/>
  </g>
<g transform="translate(354 468) scale(0.52)">

  <!-- rolled top handle -->
  <path d="M308 500 C302 358 498 358 492 500" fill="none" stroke="#5F3A1C" stroke-width="20" stroke-linecap="round" opacity=".9"/>
  <path d="M308 500 C302 358 498 358 492 500" fill="none" stroke="url(#strap)" stroke-width="15" stroke-linecap="round"/>
  <path d="M312 486 C308 372 492 372 488 486" fill="none" stroke="#D2A16D" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <!-- mouth: far rim, then the dark interior -->
  <ellipse cx="400" cy="500" rx="150" ry="31" fill="#85512C"/>
  <ellipse cx="400" cy="503" rx="140" ry="23" fill="#3A2213"/>
  <ellipse cx="400" cy="497" rx="140" ry="23" fill="#000" opacity=".35" filter="url(#occl)"/>
<g filter="url(#leather)">
  <path d="M252 500 L548 500 L531 776 Q529 802 503 802 L297 802 Q271 802 269 776 Z" fill="url(#body)"/>
  <path d="M252 500 L548 500 L531 776 Q529 802 503 802 L297 802 Q271 802 269 776 Z" fill="url(#bodyV)"/>
  <!-- turnover band at the opening -->
  <path d="M252 500 L548 500 L545 556 L255 556 Z" fill="url(#flap)" opacity=".9"/></g>

  <path d="M252 500 L548 500" fill="none" stroke="#5F3A1C" stroke-width="3.5" stroke-linejoin="round" opacity=".55"/>
  <path d="M269 776 Q271 802 297 802 L503 802 Q529 802 531 776" fill="none" stroke="#5F3A1C" stroke-width="3" stroke-linejoin="round" opacity=".55"/>
  
  <path d="M266 572 L534 572" fill="none" stroke="#5F3A1C" stroke-width="4" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".5"/>
  <path d="M266 572 L534 572" fill="none" stroke="#D2A16D" stroke-width="2.4" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".8" transform="translate(0 -0.9)"/>
  
  <path d="M288 764 L512 764" fill="none" stroke="#5F3A1C" stroke-width="4" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".5"/>
  <path d="M288 764 L512 764" fill="none" stroke="#D2A16D" stroke-width="2.4" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".8" transform="translate(0 -0.9)"/>
  <!-- flip-lock clasp -->
  <rect x="376" y="520" width="48" height="36" rx="7" fill="url(#brass)"/>
  <rect x="382" y="530" width="36" height="7" rx="3.5" fill="#5E4520" opacity=".55"/>
  <ellipse cx="390" cy="528" rx="9" ry="4" fill="#FFF6DF" opacity=".6"/>
  <ellipse cx="400" cy="562" rx="26" ry="7" fill="#000" opacity=".22" filter="url(#occl)"/>
  <!-- handle anchors -->
  <circle cx="308" cy="500" r="9" fill="url(#brass)"/><circle cx="492" cy="500" r="9" fill="url(#brass)"/>
</g>
<circle cx="532" cy="712" r="20" fill="url(#skin)"/>
<path d="M517 700 Q532 691 547 700" fill="none" stroke="#6E4526" stroke-width="2.6" opacity=".4"/>
<rect width="1000" height="1250" fill="url(#vig)"/></svg>
