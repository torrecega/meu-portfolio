<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F3EEE5"/><stop offset="1" stop-color="#E7E0D3"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DED5C4"/><stop offset="1" stop-color="#CFC4AF"/>
  </linearGradient>
  <radialGradient id="key" cx="46%" cy="38%" r="58%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="46%" r="72%">
    <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#3A2E22" stop-opacity=".12"/>
  </radialGradient>

  <!-- leather body: key light upper-left, core shadow lower-right, rim light on the right edge -->
  <linearGradient id="body" x1=".08" y1="0" x2=".95" y2="1">
    <stop offset="0" stop-color="#4E4740"/>
    <stop offset=".26" stop-color="#26221F"/>
    <stop offset=".76" stop-color="#151311"/>
    <stop offset=".95" stop-color="#26221F" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="bodyV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
    <stop offset=".18" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".82" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="flap" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#26221F"/>
    <stop offset=".55" stop-color="#151311"/>
    <stop offset="1" stop-color="#0C0A09"/>
  </linearGradient>
  <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#151311"/>
    <stop offset=".38" stop-color="#26221F"/>
    <stop offset=".62" stop-color="#4E4740" stop-opacity=".75"/>
    <stop offset="1" stop-color="#151311"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#F0D9A4"/>
    <stop offset=".34" stop-color="#C39C5E"/>
    <stop offset=".62" stop-color="#8A6836"/>
    <stop offset=".85" stop-color="#D8BC80"/>
    <stop offset="1" stop-color="#7A5A2C"/>
  </linearGradient>

  <!-- Pebbled leather. Turbulence is used as a bump map and lit, then added to the
       leather with feComposite/arithmetic: k4 cancels the grain's mean brightness, so
       it embosses without shifting the colour. All SVG 1.1 core - no blend modes,
       which silently no-op when a clip or filter isolates the group. -->
  <filter id="leather" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.34" numOctaves="4" seed="17" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#ffffff" surfaceScale="1.25" result="lit">
      <feDistantLight azimuth="228" elevation="56"/>
    </feDiffuseLighting>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="57" result="fine"/>
    <feColorMatrix in="fine" type="saturate" values="0" result="fineg"/>
    <feComposite in="lit" in2="fineg" operator="arithmetic" k1="0" k2="0.82" k3="0.18" k4="0" result="bump"/>
    <feComposite in="bump" in2="SourceGraphic" operator="arithmetic"
                 k1="0" k2="0.13" k3="1" k4="-0.068" result="emb"/>
    <feComposite in="emb" in2="SourceGraphic" operator="in"/>
  </filter>

  <filter id="soft" x="-45%" y="-160%" width="190%" height="420%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="tight" x="-30%" y="-140%" width="160%" height="380%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="occl" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>

  <radialGradient id="pool" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#A88463"/>
    <stop offset=".42" stop-color="#6E5643"/>
    <stop offset=".76" stop-color="#3A302A"/>
    <stop offset="1" stop-color="#241E1B"/>
  </radialGradient>
  <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#241C17"/><stop offset="1" stop-color="#120E0C"/>
  </linearGradient></defs>
<rect width="1000" height="1250" fill="#241E1B"/>
<circle cx="500" cy="560" r="448" fill="url(#pool)"/>
<rect y="940" width="1000" height="310" fill="url(#table)"/>
<ellipse cx="500" cy="948" rx="330" ry="30" fill="#0B0908" opacity=".6" filter="url(#occl)"/>
<g transform="translate(-140 -266) scale(1.6)">

<g filter="url(#leather)">
  <path d="M212 570 Q196 570 196 588 L196 738 Q196 756 214 756 L586 756 Q604 756 604 738 L604 588 Q604 570 586 570 Z" fill="url(#body)"/>
  <path d="M212 570 Q196 570 196 588 L196 738 Q196 756 214 756 L586 756 Q604 756 604 738 L604 588 Q604 570 586 570 Z" fill="url(#bodyV)"/>
  <path d="M196 588 Q196 570 214 570 L586 570 Q604 570 604 588 L604 610 L400 706 L196 610 Z" fill="url(#flap)"/>
  <path d="M196 612 L400 708 L604 612 L604 630 L400 726 L196 630 Z" fill="#000" opacity=".26" filter="url(#occl)"/></g>

  <path d="M196 588 Q196 570 214 570 L586 570 Q604 570 604 588 L604 610 L400 706 L196 610 Z" fill="none" stroke="#0C0A09" stroke-width="2.6" stroke-linejoin="round" opacity=".55"/>
  
  <path d="M208 604 L400 694 L592 604" fill="none" stroke="#0C0A09" stroke-width="3.7" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".5"/>
  <path d="M208 604 L400 694 L592 604" fill="none" stroke="#4E4740" stroke-width="2.1" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".8" transform="translate(0 -0.9)"/>
  
  <path d="M226 738 L574 738" fill="none" stroke="#0C0A09" stroke-width="3.7" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".5"/>
  <path d="M226 738 L574 738" fill="none" stroke="#4E4740" stroke-width="2.1" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".8" transform="translate(0 -0.9)"/>
  <rect x="358" y="682" width="84" height="18" rx="9" fill="url(#brass)"/>
  <ellipse cx="378" cy="687" rx="14" ry="3.5" fill="#FFF6DF" opacity=".6"/>
</g>
<!-- rim light picked up from the lamp behind -->
<path d="M174 700 Q174 682 192 682 L826 682 Q844 682 844 700" fill="none" stroke="#C6A177" stroke-width="3" opacity=".38"/>
<rect width="1000" height="1250" fill="url(#vig)"/></svg>
