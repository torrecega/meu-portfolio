<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EFE9DE"/><stop offset="1" stop-color="#E2DACB"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DED5C4"/><stop offset="1" stop-color="#CFC4AF"/>
  </linearGradient>
  <radialGradient id="key" cx="46%" cy="38%" r="58%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="46%" r="72%">
    <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#3A2E22" stop-opacity=".12"/>
  </radialGradient>

  <!-- leather body: key light upper-left, core shadow lower-right, rim light on the right edge -->
  <linearGradient id="body" x1=".08" y1="0" x2=".95" y2="1">
    <stop offset="0" stop-color="#C97C58"/>
    <stop offset=".26" stop-color="#A8543A"/>
    <stop offset=".76" stop-color="#7C3A26"/>
    <stop offset=".95" stop-color="#A8543A" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="bodyV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
    <stop offset=".18" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".82" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="flap" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#A8543A"/>
    <stop offset=".55" stop-color="#7C3A26"/>
    <stop offset="1" stop-color="#5C2919"/>
  </linearGradient>
  <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C3A26"/>
    <stop offset=".38" stop-color="#A8543A"/>
    <stop offset=".62" stop-color="#C97C58" stop-opacity=".75"/>
    <stop offset="1" stop-color="#7C3A26"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#F0D9A4"/>
    <stop offset=".34" stop-color="#C39C5E"/>
    <stop offset=".62" stop-color="#8A6836"/>
    <stop offset=".85" stop-color="#D8BC80"/>
    <stop offset="1" stop-color="#7A5A2C"/>
  </linearGradient>

  <!-- Pebbled leather. Turbulence is used as a bump map and lit, then added to the
       leather with feComposite/arithmetic: k4 cancels the grain's mean brightness, so
       it embosses without shifting the colour. All SVG 1.1 core - no blend modes,
       which silently no-op when a clip or filter isolates the group. -->
  <filter id="leather" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.34" numOctaves="4" seed="15" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#ffffff" surfaceScale="1.25" result="lit">
      <feDistantLight azimuth="228" elevation="56"/>
    </feDiffuseLighting>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="55" result="fine"/>
    <feColorMatrix in="fine" type="saturate" values="0" result="fineg"/>
    <feComposite in="lit" in2="fineg" operator="arithmetic" k1="0" k2="0.82" k3="0.18" k4="0" result="bump"/>
    <feComposite in="bump" in2="SourceGraphic" operator="arithmetic"
                 k1="0" k2="0.24" k3="1" k4="-0.125" result="emb"/>
    <feComposite in="emb" in2="SourceGraphic" operator="in"/>
  </filter>

  <filter id="soft" x="-45%" y="-160%" width="190%" height="420%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="tight" x="-30%" y="-140%" width="160%" height="380%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="occl" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>

  <linearGradient id="skin" x1=".15" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#A87249"/>
    <stop offset=".45" stop-color="#8A5A3C"/>
    <stop offset="1" stop-color="#5E3A24"/>
  </linearGradient>
  <linearGradient id="coat" x1=".1" y1="0" x2=".95" y2="1">
    <stop offset="0" stop-color="#F6F1E8"/>
    <stop offset=".3" stop-color="#E3DACD"/>
    <stop offset=".82" stop-color="#BFB2A0"/>
    <stop offset="1" stop-color="#A2947F"/>
  </linearGradient>
  <linearGradient id="coatV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/>
    <stop offset=".22" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="hair" x1=".2" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#7A5941"/>
    <stop offset=".42" stop-color="#4C362B"/>
    <stop offset="1" stop-color="#241812"/>
  </linearGradient>
  <linearGradient id="trouser" x1=".2" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#4A443E"/>
    <stop offset=".45" stop-color="#37322E"/>
    <stop offset="1" stop-color="#22201D"/>
  </linearGradient>
  <filter id="fold" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="figshadow" x="-40%" y="-200%" width="180%" height="500%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <clipPath id="ccoat" transform="translate(106 40) scale(0.92)">
    <path d="M414 358 Q500 334 586 358 L612 872 Q500 894 388 872 Z"/>
  </clipPath>
  <clipPath id="ctrouser" transform="translate(106 40) scale(0.92)">
    <path d="M428 846 L572 846 L566 1250 L518 1250 L500 986 L482 1250 L434 1250 Z"/>
  </clipPath></defs>
<rect width="1000" height="1250" fill="url(#wall)"/>
<g opacity=".42">
  <rect x="52" y="352" width="158" height="898" fill="#CFC5B4"/>
  <rect x="228" y="232" width="124" height="1018" fill="#C4B9A6"/>
  <rect x="370" y="436" width="182" height="814" fill="#D4CABA"/>
  <rect x="780" y="312" width="166" height="938" fill="#CABFAD"/>
  <g fill="#B3A794">
    <rect x="86" y="404" width="32" height="46"/><rect x="146" y="404" width="32" height="46"/>
    <rect x="86" y="496" width="32" height="46"/><rect x="146" y="496" width="32" height="46"/>
    <rect x="260" y="294" width="28" height="42"/><rect x="304" y="294" width="28" height="42"/>
    <rect x="260" y="382" width="28" height="42"/><rect x="304" y="382" width="28" height="42"/>
    <rect x="810" y="374" width="34" height="48"/><rect x="874" y="374" width="34" height="48"/>
    <rect x="810" y="466" width="34" height="48"/><rect x="874" y="466" width="34" height="48"/>
  </g>
</g>
<rect y="1092" width="1000" height="158" fill="url(#floor)"/>
<rect width="1000" height="1250" fill="url(#key)"/>
<ellipse cx="576" cy="1194" rx="216" ry="28" fill="#4E3F2C" opacity=".28" filter="url(#figshadow)"/>
<g transform="translate(106 40) scale(0.92)">
    <path d="M428 846 L572 846 L566 1250 L518 1250 L500 986 L482 1250 L434 1250 Z" fill="url(#trouser)"/>
    <g clip-path="url(#ctrouser)">
      <path d="M470 900 C462 1000 466 1120 458 1250" fill="none" stroke="#15130F" stroke-width="16" opacity=".4" filter="url(#fold)"/>
      <path d="M542 900 C548 1010 544 1130 550 1250" fill="none" stroke="#15130F" stroke-width="20" opacity=".35" filter="url(#fold)"/>
    </g>
    <!-- hair behind the shoulders -->
    <ellipse cx="500" cy="252" rx="71" ry="79" fill="url(#hair)"/>
    <path d="M431 250 Q423 382 439 436 L473 430 Q455 356 461 258 Z" fill="url(#hair)"/>
    <path d="M569 250 Q577 382 561 436 L527 430 Q545 356 539 258 Z" fill="url(#hair)"/>
    <!-- neck, with the shadow the jaw casts on it -->
    <rect x="480" y="292" width="40" height="74" fill="url(#skin)"/>
    <ellipse cx="500" cy="300" rx="30" ry="16" fill="#000" opacity=".26" filter="url(#fold)"/>
    <ellipse cx="500" cy="268" rx="51" ry="61" fill="url(#skin)"/>
    <path d="M449 246 Q452 190 500 188 Q548 190 551 246 Q520 214 449 246 Z" fill="url(#hair)"/>
    <ellipse cx="474" cy="216" rx="20" ry="11" fill="#FFF" opacity=".14" transform="rotate(-22 474 216)"/>
    <!-- sleeves sit under the coat body -->
    <path d="M430 386 C400 508 392 614 398 706" fill="none" stroke="#BFB2A0" stroke-width="52" stroke-linecap="round"/>
    <path d="M572 386 C602 500 600 586 578 636" fill="none" stroke="#BFB2A0" stroke-width="52" stroke-linecap="round"/>
    <path d="M578 636 C566 682 546 704 528 716" fill="none" stroke="#BFB2A0" stroke-width="45" stroke-linecap="round"/>
    <circle cx="400" cy="716" r="21" fill="url(#skin)"/>
    <!-- coat -->
    <path d="M414 358 Q500 334 586 358 L612 872 Q500 894 388 872 Z" fill="url(#coat)"/>
    <path d="M414 358 Q500 334 586 358 L612 872 Q500 894 388 872 Z" fill="url(#coatV)"/>
    <g clip-path="url(#ccoat)">
      <path d="M446 420 C438 560 444 700 436 862" fill="none" stroke="#A2947F" stroke-width="14" opacity=".34" filter="url(#fold)"/>
      <path d="M566 430 C574 570 568 710 578 866" fill="none" stroke="#A2947F" stroke-width="18" opacity=".3" filter="url(#fold)"/>
      <path d="M500 540 C494 660 502 760 498 860" fill="none" stroke="#A2947F" stroke-width="9" opacity=".26" filter="url(#fold)"/>
    </g>
    <!-- collar and lapels -->
    <path d="M466 344 L500 486 L534 344 Q500 330 466 344 Z" fill="#EFE9DE"/>
    <path d="M466 344 L500 486 L470 366 Z" fill="#BFB2A0"/>
    <path d="M534 344 L500 486 L530 366 Z" fill="#A2947F"/>
  </g>
<g transform="translate(298 486) scale(0.5)">

  <path d="M283 566 C260 292 540 292 517 566" fill="none" stroke="#5C2919" stroke-width="14" stroke-linecap="round" opacity=".85"/>
  <path d="M283 566 C260 292 540 292 517 566" fill="none" stroke="url(#strap)" stroke-width="10" stroke-linecap="round"/>
  <path d="M288 540 C268 320 532 320 512 540" fill="none" stroke="#C97C58" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>
<g filter="url(#leather)">
  <path d="M270 548 Q270 528 290 528 L510 528 Q530 528 530 548 L530 758 Q530 778 510 778 L290 778 Q270 778 270 758 Z" fill="url(#body)"/>
  <path d="M270 548 Q270 528 290 528 L510 528 Q530 528 530 548 L530 758 Q530 778 510 778 L290 778 Q270 778 270 758 Z" fill="url(#bodyV)"/>
  <!-- flap with a shadow cast onto the body below it -->
  <path d="M270 548 Q270 528 290 528 L510 528 Q530 528 530 548 L530 632 Q400 674 270 632 Z" fill="url(#flap)"/>
  <path d="M276 636 Q400 678 524 636 L524 654 Q400 696 276 654 Z" fill="#000" opacity=".3" filter="url(#occl)"/></g>

  <path d="M270 548 Q270 528 290 528 L510 528 Q530 528 530 548 L530 632 Q400 674 270 632 Z" fill="none" stroke="#5C2919" stroke-width="2.6" stroke-linejoin="round" opacity=".55"/>
  
  <path d="M288 620 Q400 660 512 620" fill="none" stroke="#5C2919" stroke-width="3.8000000000000003" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".5"/>
  <path d="M288 620 Q400 660 512 620" fill="none" stroke="#C97C58" stroke-width="2.2" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".8" transform="translate(0 -0.9)"/>
  
  <path d="M288 752 L512 752" fill="none" stroke="#5C2919" stroke-width="3.8000000000000003" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".5"/>
  <path d="M288 752 L512 752" fill="none" stroke="#C97C58" stroke-width="2.2" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".8" transform="translate(0 -0.9)"/>
  <!-- turn-lock -->
  <rect x="380" y="626" width="40" height="30" rx="6" fill="url(#brass)"/>
  <ellipse cx="390" cy="634" rx="8" ry="3.5" fill="#FFF6DF" opacity=".6"/>
  <!-- strap rings -->
  <circle cx="283" cy="562" r="15" fill="none" stroke="url(#brass)" stroke-width="7"/>
  <circle cx="517" cy="562" r="15" fill="none" stroke="url(#brass)" stroke-width="7"/>
</g>
<rect width="1000" height="1250" fill="url(#vig)"/></svg>
