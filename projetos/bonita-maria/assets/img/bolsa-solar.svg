<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F3EEE5"/><stop offset="1" stop-color="#E7E0D3"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DED5C4"/><stop offset="1" stop-color="#CFC4AF"/>
  </linearGradient>
  <radialGradient id="key" cx="46%" cy="38%" r="58%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="46%" r="72%">
    <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#3A2E22" stop-opacity=".12"/>
  </radialGradient>

  <!-- leather body: key light upper-left, core shadow lower-right, rim light on the right edge -->
  <linearGradient id="body" x1=".08" y1="0" x2=".95" y2="1">
    <stop offset="0" stop-color="#D2A16D"/>
    <stop offset=".26" stop-color="#B0703F"/>
    <stop offset=".76" stop-color="#85512C"/>
    <stop offset=".95" stop-color="#B0703F" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="bodyV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
    <stop offset=".18" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".82" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="flap" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#B0703F"/>
    <stop offset=".55" stop-color="#85512C"/>
    <stop offset="1" stop-color="#5F3A1C"/>
  </linearGradient>
  <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#85512C"/>
    <stop offset=".38" stop-color="#B0703F"/>
    <stop offset=".62" stop-color="#D2A16D" stop-opacity=".75"/>
    <stop offset="1" stop-color="#85512C"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#F0D9A4"/>
    <stop offset=".34" stop-color="#C39C5E"/>
    <stop offset=".62" stop-color="#8A6836"/>
    <stop offset=".85" stop-color="#D8BC80"/>
    <stop offset="1" stop-color="#7A5A2C"/>
  </linearGradient>

  <!-- Pebbled leather. Turbulence is used as a bump map and lit, then added to the
       leather with feComposite/arithmetic: k4 cancels the grain's mean brightness, so
       it embosses without shifting the colour. All SVG 1.1 core - no blend modes,
       which silently no-op when a clip or filter isolates the group. -->
  <filter id="leather" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.34" numOctaves="4" seed="11" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#ffffff" surfaceScale="1.25" result="lit">
      <feDistantLight azimuth="228" elevation="56"/>
    </feDiffuseLighting>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="51" result="fine"/>
    <feColorMatrix in="fine" type="saturate" values="0" result="fineg"/>
    <feComposite in="lit" in2="fineg" operator="arithmetic" k1="0" k2="0.82" k3="0.18" k4="0" result="bump"/>
    <feComposite in="bump" in2="SourceGraphic" operator="arithmetic"
                 k1="0" k2="0.26" k3="1" k4="-0.135" result="emb"/>
    <feComposite in="emb" in2="SourceGraphic" operator="in"/>
  </filter>

  <filter id="soft" x="-45%" y="-160%" width="190%" height="420%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="tight" x="-30%" y="-140%" width="160%" height="380%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="occl" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>

  <rect width="800" height="690" fill="url(#wall)"/>
  <rect y="690" width="800" height="310" fill="url(#floor)"/>
  <rect y="656" width="800" height="68" fill="url(#floor)" opacity=".55" filter="url(#occl)"/>
  <rect width="800" height="1000" fill="url(#key)"/>

  <ellipse cx="404" cy="802" rx="269.376" ry="37.536" fill="#4A3A28" opacity=".26" filter="url(#soft)"/>
  <ellipse cx="400" cy="800" rx="181.05599999999998" ry="16.56" fill="#2E2418" opacity=".42" filter="url(#tight)"/>
<g transform="translate(400 802) scale(1.2) translate(-400 -802) translate(0 -4)">

  <path d="M300 520 C296 376 358 370 354 520" fill="none" stroke="#5F3A1C" stroke-width="17" stroke-linecap="round" opacity=".9"/>
  <path d="M300 520 C296 376 358 370 354 520" fill="none" stroke="url(#strap)" stroke-width="12" stroke-linecap="round"/>
  <path d="M446 520 C442 370 504 376 500 520" fill="none" stroke="#5F3A1C" stroke-width="17" stroke-linecap="round" opacity=".9"/>
  <path d="M446 520 C442 370 504 376 500 520" fill="none" stroke="url(#strap)" stroke-width="12" stroke-linecap="round"/>
  <!-- open mouth: this bag slouches, so the rim dips -->
  <path d="M234 516 Q400 552 566 516 Q400 574 234 516 Z" fill="#3A2213"/>
  <path d="M244 520 Q400 566 556 520 Q400 552 244 520 Z" fill="#000" opacity=".4" filter="url(#occl)"/>
<g filter="url(#leather)">
  <path d="M234 528 Q400 566 566 528 L541 772 Q539 800 511 800 L289 800 Q261 800 259 772 Z" fill="url(#body)"/>
  <path d="M234 528 Q400 566 566 528 L541 772 Q539 800 511 800 L289 800 Q261 800 259 772 Z" fill="url(#bodyV)"/></g>

  <path d="M234 528 Q400 566 566 528" fill="none" stroke="#5F3A1C" stroke-width="3.2" stroke-linejoin="round" opacity=".55"/>
  
  <path d="M262 566 Q400 604 538 566" fill="none" stroke="#5F3A1C" stroke-width="3.9" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".5"/>
  <path d="M262 566 Q400 604 538 566" fill="none" stroke="#D2A16D" stroke-width="2.3" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".8" transform="translate(0 -0.9)"/>
  
  <path d="M284 762 L516 762" fill="none" stroke="#5F3A1C" stroke-width="3.9" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".5"/>
  <path d="M284 762 L516 762" fill="none" stroke="#D2A16D" stroke-width="2.3" stroke-dasharray="8 8"
        stroke-linecap="round" opacity=".8" transform="translate(0 -0.9)"/>
  <circle cx="327" cy="520" r="8" fill="url(#brass)"/>
  <circle cx="473" cy="520" r="8" fill="url(#brass)"/>
</g>
<rect width="800" height="1000" fill="url(#vig)"/>
</svg>
